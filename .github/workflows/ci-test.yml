name: CI Test

on:
  push:
    branches: ["dev", "test-github-action"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  uv-example:
    name: Python CI Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: "Set up Python"
        uses: actions/setup-python@v6
        with:
          python-version-file: ".python-version"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install the project
        run: uv sync --locked --all-extras --dev

      - name: Set up environment variables
        run: echo "OPENAI_WEBPAGE_SUMMARIZER_VLM_API_KEY=${{ secrets.OPENAI_API_KEY }}" >> .env
      
      - name: Run tests
        run: uv run pytest -s