[init]
site_id = "ncucsie"
max_depth = 2            # run name
content_threshold = 0.25 # KEEP_IMAGE_CONTENT_THRESHOLD
light_mode = true
wait_for_images = true

[crawl]
url = "https://www.csie.ncu.edu.tw/"
url_patterns = ["*csie.ncu.edu.tw*"]
allowed_domains = ["www.csie.ncu.edu.tw"]
path_prefix = "/"

[clean]
llm_exclude_words = true
llm_model = "gpt-5.6-luna"
sample_ratio = 0.1
repeat = 5
max_prompt_tokens = 200000
exclude_words = [
    # 頁首 logo 圖片
    "![資訊工程學系]",
    # 焦點新聞區塊
    "焦點新聞",
    "[ 更多 ]",
    # 底部連結
    "中央資工FB",
    "[ 教室借用 ]",
    "資電院院刊",
    "SNMG",
    # 版權宣告與聯絡資訊
    "Copyright ©",
    "版權宣告",
    "後台管理",
    "聯絡我們",
    "網站地圖",
    "隱私權聲明",
    "ncu4500@ncu.edu.tw",
    "03-422-7151",
    "03-422-2681",
    "選擇語言",
    "繁體中文",
    "Englishen-us",
    "×關閉",
    # 文章分享連結（Google+/Facebook/Twitter/Plurk 同在一行）
    "在Google+分享",
    "在Facebook分享",
    "在Twitter分享",
    "在Plurk分享",
    "分享",
    # 公告頁的「標籤」區塊標題
    "標籤",
    # 分頁導覽
    "前一頁",
    "下一頁",
    "最終頁",
    "第一頁",
    # 首頁 slide 圖片
    "![slide_",
]
