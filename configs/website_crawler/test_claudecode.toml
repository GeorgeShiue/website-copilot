[init]
site_id = "claudecode"
max_depth = 2
max_pages = 40           # run name
content_threshold = 0.25 # KEEP_IMAGE_CONTENT_THRESHOLD
light_mode = true
wait_for_images = true

[crawl]
url = "https://code.claude.com/docs/zh-TW/overview"
url_patterns = ["*code.claude.com/docs/zh-TW/*"]
allowed_domains = ["code.claude.com"]
path_prefix = "/docs/zh-TW"

[clean]
llm_model = "gpt-5.6-luna"
sample_ratio = 0.1
repeat = 5
max_prompt_tokens = 200000
