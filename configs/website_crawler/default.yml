# 網站爬蟲預設設定（nculab）；其他設定以 extends: default 繼承
run_name_fields: []

site_id: nculab

init:
  max_depth: 2 # null 為不限制深度（crawl4ai 的 0 代表只爬首頁）
  max_pages: null
  content_threshold: 0.25 # KEEP_IMAGE_CONTENT_THRESHOLD
  light_mode: true
  wait_for_images: true

crawl:
  url: https://sites.google.com/site/nculab/labintro
  url_patterns: ["*nculab*"]
  allowed_domains: [sites.google.com]
  path_prefix: null

clean:
  llm_model: gpt-5.6-luna
  sample_ratio: 0.1
  repeat: 5
  max_prompt_tokens: 200000
  seed: null
