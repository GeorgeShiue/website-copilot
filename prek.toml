[[repos]]
repo = "builtin"
hooks = [
    # code style
    # tests/fixtures 為逐字比對的快照基準、data/ 為已發布的資料（md、json、原檔、向量庫），
    # 不可被 hook 改寫
    { id = "end-of-file-fixer", exclude = '(\.md$|^tests/fixtures/|^data/)' },
    { id = "mixed-line-ending", exclude = '^(tests/fixtures|data)/' },
    { id = "trailing-whitespace", exclude = '^(tests/fixtures|data)/' },
    # git safety
    { id = "check-added-large-files", args = ["--maxkb=30720"] },
    { id = "check-merge-conflict" },
    { id = "check-case-conflict" },
    { id = "detect-private-key" },
    # config files
    { id = "check-yaml" },
    { id = "check-json" },
    { id = "check-toml" },
]

# ruff、undersort 以 local hook 經 uv 執行：版本由 uv.lock 決定，與 scripts/lint.sh、CI 一致
# undersort 須排在 ruff 之前（先排方法順序，再由 ruff 修正與格式化）；
# 傳入單一檔案時 [tool.undersort] 的 exclude 不生效，故以 files 限定只處理 src/
[[repos]]
repo = "local"
hooks = [
    { id = "undersort", name = "undersort", entry = "uv run undersort", language = "system", types = [
        "python",
    ], files = '^src/' },
    { id = "ruff-check", name = "ruff check", entry = "uv run ruff check --force-exclude --fix", language = "system", types_or = [
        "python",
        "pyi",
    ] },
    { id = "ruff-format", name = "ruff format", entry = "uv run ruff format --force-exclude", language = "system", types_or = [
        "python",
        "pyi",
    ] },
]
