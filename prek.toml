[[repos]]
repo = "builtin"
hooks = [
    # code style
    # tests/fixtures 為逐字比對的快照基準，不可被 hook 改寫
    { id = "end-of-file-fixer", exclude = '(\.md$|^tests/fixtures/)' },
    { id = "mixed-line-ending", exclude = '^tests/fixtures/' },
    { id = "trailing-whitespace", exclude = '^tests/fixtures/' },
    # git safety
    { id = "check-added-large-files", args = ["--maxkb=30720"] },
    { id = "check-merge-conflict" },
    { id = "check-case-conflict" },
    { id = "detect-private-key" },
    # config files
    { id = "check-yaml" },
    { id = "check-json" },
    { id = "check-toml" },
]

# ruff 以 local hook 經 uv 執行：版本由 uv.lock 決定，與 scripts/lint.sh、CI 一致
[[repos]]
repo = "local"
hooks = [
    { id = "ruff-check", name = "ruff check", entry = "uv run ruff check --force-exclude --fix", language = "system", types_or = [
        "python",
        "pyi",
    ] },
    { id = "ruff-format", name = "ruff format", entry = "uv run ruff format --force-exclude", language = "system", types_or = [
        "python",
        "pyi",
    ] },
]
