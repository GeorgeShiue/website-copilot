[project]
name = "website-copilot"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13.12"
dependencies = [
    "beautifulsoup4>=4.14.3",
    "crawl4ai>=0.8.0",
    "langchain-community>=0.4.1",
    "litellm[google]>=1.0.0",
    "llama-index>=0.14.16",
    "llama-index-llms-google-genai>=0.9.2",
    "llama-index-llms-openai>=0.7.7",
    "llama-index-readers-file>=0.6.0",
    "llama-index-vector-stores-qdrant>=0.10.1",
    "mdformat>=1.0.0",
    "mdformat-gfm>=1.0.0",
    "playwright>=1.58.0",
    "pyright>=1.1.408",
    "python-dotenv>=1.0.0",
    "rich>=14.3.2",
    "tomlkit>=0.14.0",
]

[dependency-groups]
dev = ["prek>=0.3.5", "pytest>=9.0.2", "ruff>=0.15.4"]

[tool.ruff]
exclude = ["dev/**", ".venv"]

[tool.pyright]
exclude = ["dev/**", "**/node_modules", "**/__pycache__", ".venv", "**/.*"]
typeCheckingMode = "basic"

[tool.pyright.typeEvaluation]
deprecateTypingAliases = true
strictDictionaryInference = true
strictListInference = true
strictSetInference = true

[tool.pytest.ini_options]
pythonpath = ["."]
addopts = "-s -v"
