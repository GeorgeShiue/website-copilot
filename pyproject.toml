[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "website-copilot"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13.12"
dependencies = [
    "beautifulsoup4>=4.14.3",
    "crawl4ai>=0.9.2",
    "docling>=2.133.0",
    "fastapi>=0.141.1",
    "firecrawl-anydoc>=0.2.4",
    "flagembedding>=1.4.2",
    "httpx>=0.28.1",
    "langchain>=1.4.0",
    "langchain-google-genai>=4.3.2",
    "langchain-openai>=0.3.0",
    "langgraph>=1.2.10",
    "litellm[google]>=1.0.0",
    "llama-index>=0.14.24",
    "llama-index-llms-google-genai>=0.9.2",
    "llama-index-llms-openai>=0.7.9",
    "llama-index-vector-stores-milvus>=1.1.0",
    "mdformat>=1.0.0",
    "mdformat-gfm>=1.0.0",
    "milvus-lite==3.2.0",
    "pillow>=12.2.0",
    "playwright>=1.58.0",
    "pydantic>=2.12.5",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.3",
    "rich>=14.3.2",
    "tyro>=1.0.13",
    "uvicorn>=0.52.1",
]

[project.scripts]
website-copilot = "website_copilot.cli:main"

[dependency-groups]
dev = [
    "prek>=0.5.5",
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "ruff>=0.15.4",
]

# crawl4ai 0.8.6+/0.9.2 依賴 unclecode-litellm（2026-03-24 LiteLLM 供應鏈攻擊後，
# 作者發布的 litellm 1.81.13 應急 fork，非惡意套件）。
# 但與官方 litellm 共用 litellm/ 模組目錄，安裝時會覆蓋官方檔案（已實測驗證），
# 造成 ImportError（如 _redact_string 缺失），故從依賴圖中排除。
[tool.uv]
exclude-dependencies = ["unclecode-litellm"]

[tool.hatch.build.targets.wheel]
packages = ["src/website_copilot"]

[tool.ruff]
# extend-exclude 保留 ruff 內建的預設排除（.git / build / dist / node_modules 等），
# 另外排除執行產物、資料與非 Python 原始碼目錄
extend-exclude = [
    ".venv",
    "runs",       # run 產物
    "chats",      # 對話紀錄
    "data",       # prepare 階段 publish 的資料
    "docs",       # 文件與實驗紀錄
    "extension",  # Chrome Extension（JS）
]

[tool.pyright]
# docs/exp/memo/webpage_image_summarizer：針對舊版逐頁 ImageSummarizer 內部實作的實驗腳本（歷史紀錄），
# P1c 重構後不再對應，不納入型別檢查
exclude = [
    "**/node_modules",
    "**/__pycache__",
    ".venv",
    "**/.*",
    "docs/exp/memo/webpage_image_summarizer",
]
typeCheckingMode = "basic"
deprecateTypingAliases = true
strictDictionaryInference = true
strictListInference = true
strictSetInference = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-s -v"
markers = [
    "cost: 會呼叫 LLM / VLM / embedding API 而產生費用的測試，可用 -m \"not cost\" 略過",
    "network: 連真實網站（不產生費用）的測試，可用 -m \"not network\" 略過",
    "heavy: 載入 Docling 等大型模型、執行較慢的測試，可用 -m \"not heavy\" 略過",
]
