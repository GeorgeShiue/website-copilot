[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "website-copilot"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13.12"
dependencies = [
    "beautifulsoup4>=4.14.3",
    "crawl4ai>=0.9.2",
    "fastapi>=0.141.1",
    "flagembedding>=1.4.2",
    "langchain>=1.4.0",
    "langchain-google-genai>=4.3.2",
    "langchain-openai>=0.3.0",
    "langgraph>=1.2.10",
    "litellm[google]>=1.0.0",
    "llama-index>=0.14.24",
    "llama-index-llms-google-genai>=0.9.2",
    "llama-index-llms-openai>=0.7.9",
    "llama-index-vector-stores-milvus>=1.1.0",
    "mdformat>=1.0.0",
    "mdformat-gfm>=1.0.0",
    "milvus-lite==3.2.0",
    "playwright>=1.58.0",
    "python-dotenv>=1.0.0",
    "rich>=14.3.2",
    "tomlkit>=0.14.0",
    "tyro>=1.0.13",
    "uvicorn>=0.52.1",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "prek>=0.3.5",
    "pyright>=1.1.408",
    "pytest>=9.0.2",
    "ruff>=0.15.4",
]

# crawl4ai 0.8.6+/0.9.2 依賴 unclecode-litellm（2026-03-24 LiteLLM 供應鏈攻擊後，
# 作者發布的 litellm 1.81.13 應急 fork，非惡意套件）。
# 但與官方 litellm 共用 litellm/ 模組目錄，安裝時會覆蓋官方檔案（已實測驗證），
# 造成 ImportError（如 _redact_string 缺失），故從依賴圖中排除。
[tool.uv]
exclude-dependencies = ["unclecode-litellm"]

[tool.hatch.build.targets.wheel]
packages = ["src/app", "src/utils"]

[tool.ruff]
exclude = ["dev/**", ".venv"]

[tool.pyright]
exclude = ["dev/**", "**/node_modules", "**/__pycache__", ".venv", "**/.*"]
typeCheckingMode = "basic"

[tool.pyright.typeEvaluation]
deprecateTypingAliases = true
strictDictionaryInference = true
strictListInference = true
strictSetInference = true

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["src/test"]
addopts = "-s -v"
markers = [
    "slow: 端到端測試（真實爬蟲 / LLM / 建庫），預設略過。執行完整測試用 -m slow",
]
