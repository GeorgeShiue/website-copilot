[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "website-copilot"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13.12"
dependencies = [
    "beautifulsoup4>=4.14.3",
    "crawl4ai>=0.9.2",
    "docling>=2.133.0",
    "fastapi>=0.141.1",
    "firecrawl-anydoc>=0.2.4",
    "flagembedding>=1.4.2",
    "httpx>=0.28.1",
    "langchain>=1.4.0",
    "langchain-google-genai>=4.3.2",
    "langchain-openai>=0.3.0",
    "langgraph>=1.2.10",
    "litellm[google]>=1.0.0",
    "llama-index>=0.14.24",
    "llama-index-llms-google-genai>=0.9.2",
    "llama-index-llms-openai>=0.7.9",
    "llama-index-vector-stores-milvus>=1.1.0",
    "mdformat>=1.0.0",
    "mdformat-gfm>=1.0.0",
    "milvus-lite==3.2.1",
    "pillow>=12.2.0",
    "playwright>=1.58.0",
    "pydantic>=2.12.5",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.3",
    "rich>=14.3.2",
    "tyro>=1.0.13",
    "uvicorn>=0.52.1",
]

[project.scripts]
website-copilot = "website_copilot.cli:main"

[dependency-groups]
dev = [
    "import-linter>=2.15",
    "prek>=0.5.5",
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
    "undersort>=0.1.6",
]

# unclecode-litellm（crawl4ai 的 litellm 應急 fork）與官方 litellm 共用 litellm/ 目錄，
# 安裝時會覆蓋官方檔案造成 ImportError，故排除。
[tool.uv]
exclude-dependencies = ["unclecode-litellm"]

# nltk 3.10 的 pathsec 拒絕 uv 預設的 hardlink 檔案，會使 RAG 建置 PermissionError；
# 暫時限制，待 llama-index 處理或改用 link-mode = "copy" 後移除。
constraint-dependencies = ["nltk<3.10"]

[tool.hatch.build.targets.wheel]
packages = ["src/website_copilot"]

[tool.ruff]
# extend-exclude 在 ruff 預設排除之外，再排除產物、資料與非 Python 目錄
extend-exclude = [
    ".venv",
    "runs",       # run 產物
    "chats",      # 對話紀錄
    "data",       # prepare 階段 publish 的資料
    "docs",       # 文件與實驗紀錄
    "extension",  # Chrome Extension（JS）
]

[tool.ruff.format]
# ruff 0.16 會格式化 Markdown；fixtures 的 .md 為逐字比對快照，文件另由 mdformat 管理
exclude = ["*.md"]

[tool.undersort]
# 只整理 src/ 內 class 的方法順序（public → protected → private）；不排模組層級定義。
# exclude 只對「目錄參數」生效，pre-commit hook 傳入單一檔案時無效，故 hook 另以 files 限定 src/。
# tests/ 的方法順序即 pytest 執行順序，不做重排。
exclude = ["tests/*"]

[tool.pyright]
exclude = [
    "**/node_modules",
    "**/__pycache__",
    ".venv",
    "**/.*",
]
typeCheckingMode = "basic"
deprecateTypingAliases = true
strictDictionaryInference = true
strictListInference = true
strictSetInference = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-s -v"
markers = [
    "cost: 會呼叫 LLM / VLM / embedding API 而產生費用的測試，可用 -m \"not cost\" 略過",
    "network: 連真實網站（不產生費用）的測試，可用 -m \"not network\" 略過",
    "heavy: 載入 Docling 等大型模型、執行較慢的測試，可用 -m \"not heavy\" 略過",
]

# 依賴方向：由上到下單向依賴，避免循環與底層反向依賴 agent／server。
# 檢查：uv run lint-imports（已納入 scripts/lint.sh）
[tool.importlinter]
root_package = "website_copilot"

[[tool.importlinter.contracts]]
name = "底層模組不可依賴 agent 與 server"
type = "forbidden"
# config、utils 是沒有 __init__.py 的 namespace 資料夾，無法直接指定套件，改用萬用字元
source_modules = [
    "website_copilot.config.*",
    "website_copilot.ingestion",
    "website_copilot.retrieval",
    "website_copilot.storage",
    "website_copilot.utils.*",
]
forbidden_modules = ["website_copilot.agent", "website_copilot.server"]

[[tool.importlinter.contracts]]
name = "prepare 階段不依賴 agent 與 server"
type = "forbidden"
source_modules = ["website_copilot.pipelines.prepare"]
forbidden_modules = ["website_copilot.agent", "website_copilot.server"]

[[tool.importlinter.contracts]]
name = "agent tools 分層：tool 在 site_discovery／webpage_retriever 之上，兩者互相獨立"
type = "layers"
layers = [
    "website_copilot.agent.tools.tool",
    "website_copilot.agent.tools.site_discovery | website_copilot.agent.tools.webpage_retriever",
]

[[tool.importlinter.contracts]]
name = "主要套件分層（上層可依賴下層，反之不可）"
type = "layers"
layers = [
    "website_copilot.cli",
    "website_copilot.pipelines",
    "website_copilot.server",
    "website_copilot.agent",
    "website_copilot.retrieval",
    "website_copilot.ingestion",
    "website_copilot.storage",
]
