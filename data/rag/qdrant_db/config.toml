[init]
webpages_data_folder_path = "data/webpages"

[vector_store]
collection_name = "webpages"
qdrant_db_folder_path = "data/rag/qdrant_db"

[nodes]
paragraph_separator = "\n\n"
chunk_overlap = 100
chunk_size = 800

[index]
embedding_name = "text-embedding-3-small"

[retriever]
top_k = 10

[query_engine]
cutoff = 0.4
query = "加入實驗室需要準備哪些資料？"
llm_name = "gemini-3.1-flash-lite"
