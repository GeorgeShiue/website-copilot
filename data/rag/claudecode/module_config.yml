# source: 轉換自舊版 module_config.toml
# run_name_fields: [vector_store.vector_store_type]
site_id: claudecode
webpages_data_folder_path: data/webpages/claudecode
nodes:
  chunk_size: 800
  chunk_overlap: 100
  paragraph_separator: "\n\n"
vector_store:
  vector_store_type: milvus
  milvus_uri: data/rag/claudecode/milvus.db
  hybrid_ranker: WeightedRanker
  hybrid_ranker_params:
    weights:
    - 1.0
    - 0.5
    k: null
index:
  embedding_name: text-embedding-3-small
retriever:
  query_mode: hybrid
  similarity_top_k: 10
  hybrid_top_k: 10
  alpha: 0.5
query_engine:
  query_llm_name: gpt-5.6-luna
  evaluator_llm_name: gpt-5.6-terra
  cutoff: 0.0
  query: 如何安裝 Claude Code？
