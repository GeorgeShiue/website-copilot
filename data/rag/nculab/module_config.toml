[init]
site_id = "nculab"
webpages_data_folder_path = "data/webpages/nculab"

[vector_store]
vector_store_type = "milvus" # run name
milvus_uri = "data/rag/nculab/milvus.db"
hybrid_ranker = "WeightedRanker"

[vector_store.hybrid_ranker_params]
weights = [1.0, 0.5]

[nodes]
chunk_size = 800
chunk_overlap = 100
paragraph_separator = "\n\n"

[index]
embedding_name = "text-embedding-3-small"

[retriever]
query_mode = "hybrid"
hybrid_top_k = 10
alpha = 0.5
similarity_top_k = 10

[query_engine]
query_llm_name = "gpt-5.6-luna"
cutoff = 0.0
query = "實驗室的成員有哪些人？"
evaluator_llm_name = "gpt-5.6-terra"
