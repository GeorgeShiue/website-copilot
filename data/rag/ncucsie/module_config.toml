[init]
site_id = "ncucsie"
webpages_data_folder_path = "data/webpages/ncucsie"

[vector_store]
milvus_uri = "data/rag/ncucsie/milvus.db"
vector_store_type = "milvus" # run name
hybrid_ranker = "WeightedRanker"

[vector_store.hybrid_ranker_params]
weights = [1.0, 0.5]

[nodes]
paragraph_separator = "\n\n"
chunk_size = 800
chunk_overlap = 100

[index]
embedding_name = "text-embedding-3-small"

[retriever]
similarity_top_k = 10
hybrid_top_k = 10
alpha = 0.5
query_mode = "hybrid"

[query_engine]
cutoff = 0.0
query_llm_name = "gpt-5.6-luna"
query = "介紹資工系課程"
evaluator_llm_name = "gpt-5.6-terra"
