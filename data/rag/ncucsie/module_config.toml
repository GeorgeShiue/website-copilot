[init]
webpages_data_folder_path = "data/webpages/ncucsie"
site_id = "ncucsie"

[vector_store]
qdrant_db_folder_path = "data/rag/ncucsie/qdrant_db"
vector_store_type = "milvus" # run name
milvus_uri = "data/rag/ncucsie/milvus.db"
hybrid_ranker = "WeightedRanker"

[vector_store.hybrid_ranker_params]
weights = [1.0, 0.5]

[nodes]
paragraph_separator = "\n\n"
chunk_size = 800
chunk_overlap = 100

[index]
embedding_name = "text-embedding-3-small"

[retriever]
similarity_top_k = 10
hybrid_top_k = 10
query_mode = "hybrid"
alpha = 0.5

[query_engine]
cutoff = 0.0
query = "實驗室的成員有哪些人？"
query_llm_name = "gemini-3.1-flash-lite"
evaluator_llm_name = "gpt-5.4"
